<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسواق الشرق - التداول والأسعار اللحظية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        :root {
            --bg-main: #0c0d10;
            --bg-card: #151821;
            --bg-card-hover: #1e2230;
            --accent-gold: #d4af37;
            --accent-gold-light: #f3e5ab;
            --text-main: #f0f2f5;
            --text-muted: #8a91a0;
            --green: #00c853;
            --red: #ff3d00;
            --border: #232733;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 30px; }

        header {
            background: rgba(21, 24, 33, 0.95);
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            color: #000; font-size: 1.1rem;
        }
        .logo-text h1 { font-size: 1.1rem; color: var(--accent-gold-light); }
        .logo-text span { font-size: 0.75rem; color: var(--text-muted); }

        .container { max-width: 1400px; margin: 15px auto; padding: 0 15px; }

        .asset-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px; margin-bottom: 15px;
        }

        .asset-card {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 12px 15px; border-radius: 10px; cursor: pointer; transition: 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }

        .asset-card:hover, .asset-card.active { border-color: var(--accent-gold); background: var(--bg-card-hover); }
        .asset-info h3 { font-size: 0.85rem; color: var(--text-muted); }
        .asset-price { font-size: 1.1rem; font-weight: bold; margin-top: 4px; }
        .price-up { color: var(--green); }
        .price-down { color: var(--red); }

        .alert-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 15px; margin-bottom: 15px;
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
            justify-content: space-between;
        }
        .alert-inputs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .alert-inputs input, .alert-inputs select {
            background: var(--bg-main); border: 1px solid var(--border);
            color: #fff; padding: 8px 12px; border-radius: 6px; outline: none;
        }
        .btn-alert {
            background: var(--accent-gold); color: #000; border: none;
            padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }

        .chart-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px; height: 580px; margin-bottom: 20px;
        }

        .grid-two { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 900px) { .grid-two { grid-template-columns: 1fr; } .chart-box { height: 450px; } }

        .section-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; padding: 15px; height: 500px; display: flex; flex-direction: column;
        }

        .section-header {
            font-size: 1rem; font-weight: bold; color: var(--accent-gold-light);
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
            border-bottom: 1px solid var(--border); padding-bottom: 8px;
        }

        .content-scroll { flex: 1; overflow-y: auto; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-icon"><i class="fa-solid fa-chart-candlestick"></i></div>
            <div class="logo-text">
                <h1>أسواق الشرق</h1>
                <span>متابعة أسعار الذهب والبيتكوين اللحظية</span>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- شريط الأسعار الحية -->
        <div class="asset-bar">
            <div class="asset-card active" onclick="loadChart('OANDA:XAUUSD', this)">
                <div class="asset-info">
                    <h3>الذهب العالمي (XAU/USD)</h3>
                    <div id="gold-price" class="asset-price">جاري التحميل...</div>
                </div>
                <i class="fa-solid fa-coins" style="color: #d4af37; font-size: 1.4rem;"></i>
            </div>

            <div class="asset-card" onclick="loadChart('BINANCE:BTCUSDT', this)">
                <div class="asset-info">
                    <h3>بيتكوين (BTC/USDT)</h3>
                    <div id="btc-price" class="asset-price">جاري التحميل...</div>
                </div>
                <i class="fa-brands fa-bitcoin" style="color: #f7931a; font-size: 1.4rem;"></i>
            </div>

            <div class="asset-card" onclick="loadChart('BINANCE:ETHUSDT', this)">
                <div class="asset-info">
                    <h3>إيثريوم (ETH/USDT)</h3>
                    <div id="eth-price" class="asset-price">جاري التحميل...</div>
                </div>
                <i class="fa-brands fa-ethereum" style="color: #627eea; font-size: 1.4rem;"></i>
            </div>
        </div>

        <!-- نظام التنبيهات -->
        <div class="alert-box">
            <div style="font-weight: bold; color: var(--accent-gold-light);">
                <i class="fa-solid fa-bell"></i> إنشاء تنبيه سعر:
            </div>
            <div class="alert-inputs">
                <select id="alert-asset">
                    <option value="BTC">البيتكوين (BTC)</option>
                    <option value="GOLD">الذهب (XAU/USD)</option>
                </select>
                <input type="number" id="alert-target" placeholder="السعر المستهدف..." />
                <button class="btn-alert" onclick="setPriceAlert()">تفعيل التنبيه</button>
            </div>
            <div id="alert-status" style="font-size: 0.85rem; color: var(--text-muted);">لا توجد تنبيهات نشطة</div>
        </div>

        <!-- الشارت الحي المعتمد -->
        <div class="chart-box">
            <div id="tv_chart_container" style="height: 100%; width: 100%;"></div>
        </div>

        <!-- الأخبار و تويتر -->
        <div class="grid-two">
            <div class="section-box">
                <div class="section-header"><i class="fa-solid fa-newspaper" style="color: #4fc3f7;"></i> الأخبار الاقتصادية</div>
                <div class="content-scroll">
                    <div class="tradingview-widget-container">
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                        {
                            "feedMode": "market",
                            "market": "crypto",
                            "colorTheme": "dark",
                            "isTransparent": true,
                            "displayMode": "regular",
                            "width": "100%",
                            "height": "100%",
                            "locale": "ar_AE"
                        }
                        </script>
                    </div>
                </div>
            </div>

            <div class="section-box">
                <div class="section-header"><i class="fa-brands fa-x-twitter" style="color: #fff;"></i> تغريدات الأسواق (إكس)</div>
                <div class="content-scroll">
                    <a class="twitter-timeline" data-theme="dark" data-chrome="noheader nofooter transparent" href="https://twitter.com/ReutersBiz">جاري تحميل الأخبار...</a>
                </div>
            </div>
        </div>

    </div>

    <script>
        let currentBtcPrice = 0;
        let currentGoldPrice = 0;
        let alertBtcTarget = null;
        let alertGoldTarget = null;

        // 1. تحميل شارت OANDA العالمي المباشر بدقة متناهية
        function loadChart(symbol, cardEl) {
            if(cardEl) {
                document.querySelectorAll('.asset-card').forEach(c => c.classList.remove('active'));
                cardEl.classList.add('active');
            }
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "60",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ar_AE",
                "toolbar_bg": "#151821",
                "allow_symbol_change": true,
                "hide_side_toolbar": false,
                "container_id": "tv_chart_container",
                "studies": ["RSI@tv-basicstudies", "MASimple@tv-basicstudies"]
            });
        }
        
        // التشغيل الافتراضي لرمز الذهب العالمي الصريح
        loadChart('OANDA:XAUUSD', null);

        // 2. الربط المباشر مع أسعار التداول اللحظية
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker/paxgusdt@ticker/ethusdt@ticker');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const price = parseFloat(data.c).toFixed(2);

            if (data.s === 'BTCUSDT') {
                updatePriceDisplay('btc-price', price, currentBtcPrice);
                currentBtcPrice = price;
                checkAlerts('BTC', currentBtcPrice, alertBtcTarget);
            } else if (data.s === 'PAXGUSDT') {
                updatePriceDisplay('gold-price', price, currentGoldPrice);
                currentGoldPrice = price;
                checkAlerts('GOLD', currentGoldPrice, alertGoldTarget);
            } else if (data.s === 'ETHUSDT') {
                updatePriceDisplay('eth-price', price, 0);
            }
        };

        function updatePriceDisplay(elementId, newPrice, oldPrice) {
            const el = document.getElementById(elementId);
            el.innerText = '$' + Number(newPrice).toLocaleString();
            if (oldPrice > 0) {
                el.className = newPrice >= oldPrice ? 'asset-price price-up' : 'asset-price price-down';
            }
        }

        // 3. نظام التنبيهات الصوتي
        function setPriceAlert() {
            const asset = document.getElementById('alert-asset').value;
            const target = parseFloat(document.getElementById('alert-target').value);

            if (!target) return alert('يرجى كتابة السعر المستهدف أولاً');

            if (asset === 'BTC') alertBtcTarget = target;
            if (asset === 'GOLD') alertGoldTarget = target;

            document.getElementById('alert-status').innerText = `تنبيه نشط لـ ${asset} عند $${target.toLocaleString()}`;
            alert('تم حفظ التنبيه!');
        }

        function checkAlerts(asset, currentPrice, targetPrice) {
            if (targetPrice && currentPrice >= targetPrice) {
                playAlertSound();
                alert(`🚨 تنبيه! وصل سعر ${asset} إلى الهدف: $${currentPrice}`);
                if (asset === 'BTC') alertBtcTarget = null;
                if (asset === 'GOLD') alertGoldTarget = null;
                document.getElementById('alert-status').innerText = 'تم تحقيق التنبيه!';
            }
        }

        function playAlertSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1);
        }
    </script>
</body>
</html>
